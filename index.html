<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4efe4"><title>自主听写</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><header class="top"><div class="brand"><span class="seal">文</span><span>自主听写</span></div><select id="language" aria-label="翻译语言"><option value="en">英语 · English</option><option value="ru">俄语 · Русский</option><option value="tk">土库曼语 · Türkmençe</option><option value="id">印尼语 · Bahasa Indonesia</option><option value="ar">阿拉伯语 · العربية</option><option value="kk">哈萨克语 · Қазақша</option></select></header>
<section id="page-input" class="screen panel"><label for="phrases" class="input-label"><span>输入听写内容（一行一个）</span><span id="input-translation" lang="en">Enter dictation content (one per line)</span></label><textarea id="phrases" spellcheck="false"></textarea><button id="prepare" class="button primary"><span>完成</span><span id="done-translation" lang="en">Done</span></button></section>
<section id="page-practice" class="screen panel hidden"><div class="prompt-card"><button id="replay" class="replay" aria-label="播放">▶</button><div class="speed-row"><label for="speed">语速</label><input type="range" id="speed" min="0.5" max="1.5" step="0.05" value="0.85"><span class="speed-val" id="speed-val">0.85×</span></div></div><button id="next" class="button primary"><span>下一个</span><span id="next-translation" lang="en">Next</span></button><button id="check" class="button primary hidden"><span>检查答案</span><span id="check-translation" lang="en">Check answers</span></button></section>
<section id="page-answers" class="screen panel hidden"><div id="answers" class="answers"></div><button id="again" class="button primary"><span>再默一次</span><span id="again-translation" lang="en">Dictate again</span></button></section></main><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
